<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-base: #f3f5f8;
      --bg-surface: #ffffff;
      --border-light: rgba(0, 0, 0, 0.08);
      --color-primary: #7c3aed;
      --color-primary-hover: #6d28d9;
      --color-emerald: #059669;
      --color-emerald-hover: #047857;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      width: 320px;
      background: var(--bg-base);
      color: var(--text-primary);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .status-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: rgba(124, 58, 237, 0.08);
      color: var(--color-primary);
      border: 1px solid rgba(124, 58, 237, 0.15);
    }

    .intro-text {
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .item-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .scraped-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem;
      border-radius: 6px;
      border: 1px solid var(--border-light);
      background: #fafafa;
    }

    .item-img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--border-light);
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .item-store {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .item-price {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--color-emerald);
      white-space: nowrap;
    }

    .empty-state {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      width: 100%;
      padding: 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.15s ease-in-out;
      border: none;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
    }

    .btn-primary:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }

    .btn-emerald {
      background: var(--color-emerald);
      color: white;
    }

    .btn-emerald:hover {
      background: var(--color-emerald-hover);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.02);
      border-color: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <!-- SVG LineChart Vector -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary)">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>OmniTrack Sync</span>
    </div>
    <span class="status-badge" id="store-badge">Scanning...</span>
  </header>

  <p class="intro-text" id="intro-text">
    Open your shopping cart or wishlist page on Zalando, BSTN, HHV, END, or Asphaltgold, and click below to scrape items securely.
  </p>

  <div class="panel">
    <h4 style="font-size: 0.75rem; font-weight: 700; color: var(--text-secondary)">Scraped Cart Preview</h4>
    <div class="item-list" id="item-list">
      <div class="empty-state">
        <!-- SVG ShoppingCart -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>No items discovered yet</span>
      </div>
    </div>
  </div>

  <button type="button" class="btn btn-primary" id="btn-scan">
    <!-- SVG Send Paperplane -->
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
    <span>Scan & Sync to Dashboard</span>
  </button>

  <button type="button" class="btn btn-secondary" id="btn-copy" disabled style="display: none;">
    <!-- SVG Copy -->
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    <span>Copy Sync Payload (Backup)</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
